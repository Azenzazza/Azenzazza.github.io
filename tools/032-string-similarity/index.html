  <meta name="description" content="2文字列の類似度を数値で表示">
  <style>
    body {
      margin: 0;

    textarea:focus, input:focus {

<body>
  <header>
    <div style="display:flex; align-items:center;">
      <img src="../../../logo.png" alt="サイトロゴ" class="logo">
      <div class="site-title">Azenzazzaのサイト</div>
    </div>

    <nav class="navbar">
      <a href="../../../">ホーム</a>
      <a href="../../../project/project.html">プロジェクト</a>
      <a href="../../../tools/tools.html">ツール</a>
    </nav>
  </header>

  <main>
    <h1>文字列類似度計算</h1>
    <p class="lead">2文字列の類似度を数値で表示</p>

    <div class="tool-card">
      <div class="input-group"><label>文字列1: <input type="text" id="str1"></label></div><div class="input-group"><label>文字列2: <input type="text" id="str2"></label></div><button id="calcBtn">計算</button><div id="inputResult"></div>
    </div>

    <div class="result" id="resultDisplay"></div>
  </main>

  <footer>
    &copy; 2026 Azenzazza.
  </footer>

  <script>
document.getElementById('calcBtn').addEventListener('click', function () {
  var s1 = document.getElementById('str1').value;
  var s2 = document.getElementById('str2').value;

  function lev(a, b) {
    var m = a.length, n = b.length;
    var dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
    for (var i = 0; i <= m; i++) dp[i][0] = i;
    for (var j = 0; j <= n; j++) dp[0][j] = j;
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + cost
        );
      }
    }
    return dp[m][n];
  }

  var distance = lev(s1, s2);
  var maxLen = Math.max(s1.length, s2.length);
  var similarity;
  if (maxLen === 0) {
    similarity = 100;
  } else {
    similarity = (1 - distance / maxLen) * 100;
    similarity = Math.max(0, Math.min(100, similarity));
    similarity = similarity.toFixed(2);
  }

  document.getElementById('resultDisplay').textContent = 'Levenshtein距離: ' + distance + ' 類似率: ' + similarity + '%';
});
  </script>
</body>
</html>
